<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{host}}</title>
  <style>
    :root { --bg: #ffffff; --fg: #1d1d1f; --dim: #8e8e93; --btn: rgba(0,0,0,.06); }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #2c2c2e; --fg: #f2f2f7; --dim: #8e8e93; --btn: rgba(255,255,255,.08); }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
    body {
      display: grid; place-items: center;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 420px; padding: 24px; text-align: center; transform: translateY(-6vh); }
    h1 { font-size: 22px; font-weight: 600; letter-spacing: -.01em; margin: 0 0 6px; }
    p { margin: 0; color: var(--dim); }
    code { font-size: 11px; color: var(--dim); opacity: .7; display: block; margin-top: 18px; }
    button {
      margin-top: 22px; padding: 8px 18px; border: 0; border-radius: 999px;
      background: var(--btn); color: var(--fg); font: inherit; font-size: 13.5px; cursor: pointer;
    }
    button:hover { filter: brightness(.96); }
  </style>
</head>
<body>
  <main>
    <h1>{{host}}</h1>
    <p>{{message}}</p>
    <button onclick="location.reload()">Try again</button>
    <code>{{code}}</code>
  </main>
</body>
</html>
