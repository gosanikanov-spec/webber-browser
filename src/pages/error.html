<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{host}}</title>
  <style>:root { --bg: #1b1b1f; --fg: #e4e4e7; --accent: #8b9cf7; }</style>
  <!--theme-->
  <style>
    :root { --card: color-mix(in srgb, var(--bg), var(--fg) 4%); --dim: color-mix(in srgb, var(--fg) 55%, var(--card)); }
    @media (prefers-color-scheme: light) { :root { --card: var(--bg); } }
    html, body { margin: 0; height: 100%; background: var(--card); color: var(--fg); }
    body {
      display: grid; place-items: center;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 420px; padding: 24px; text-align: center; transform: translateY(-6vh); }
    h1 { font-size: 22px; font-weight: 600; letter-spacing: -.01em; margin: 0 0 6px; }
    p { margin: 0; color: var(--dim); }
    code { font-size: 11px; color: var(--dim); opacity: .7; display: block; margin-top: 18px; }
    button {
      margin-top: 22px; padding: 8px 18px; border: 0; border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--fg);
      font: inherit; font-size: 13.5px; cursor: pointer;
    }
    button:hover { background: color-mix(in srgb, var(--accent) 32%, transparent); }
  </style>
</head>
<body>
  <main>
    <h1>{{host}}</h1>
    <p>{{message}}</p>
    <button onclick="location.reload()">Try again</button>
    <code>{{code}}</code>
  </main>
</body>
</html>
