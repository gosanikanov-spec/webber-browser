<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>New Tab</title>
  <style>
    :root { --bg: #ffffff; --fg: #1d1d1f; --dim: #a1a1a6; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #2c2c2e; --fg: #f2f2f7; --dim: #6e6e73; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
    body {
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      cursor: default;
    }
    main { text-align: center; transform: translateY(-6vh); animation: in .5s ease-out both; }
    #time {
      font-size: clamp(56px, 10vw, 112px);
      font-weight: 200;
      letter-spacing: -.04em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    #date { margin-top: 14px; font-size: 15px; color: var(--dim); letter-spacing: .01em; }
    @keyframes in { from { opacity: 0; transform: translateY(-4vh); } }
    @media (prefers-reduced-motion: reduce) { main { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div id="time"></div>
    <div id="date"></div>
  </main>
  <script>
    const time = document.getElementById('time');
    const date = document.getElementById('date');
    function tick() {
      const d = new Date();
      time.textContent = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      date.textContent = d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
