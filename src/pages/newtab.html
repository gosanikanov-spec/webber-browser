<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>New Tab</title>
  <style>
    :root { --bg: #1b1b1f; --fg: #e4e4e7; --accent: #8b9cf7; }
  </style>
  <!--theme-->
  <style>
    /* the page card is a touch lifted from the Omarchy background the frame uses */
    :root { --card: color-mix(in srgb, var(--bg), var(--fg) 4%); }
    @media (prefers-color-scheme: light) { :root { --card: var(--bg); } }
    html, body { margin: 0; height: 100%; background: var(--card); color: var(--fg); }
    body {
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      cursor: default;
    }
    main { text-align: center; transform: translateY(-6vh); animation: in .5s ease-out both; }
    #time {
      font-size: clamp(56px, 10vw, 112px);
      font-weight: 200;
      letter-spacing: -.04em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    #date { margin-top: 14px; font-size: 15px; color: color-mix(in srgb, var(--fg) 50%, var(--card)); }
    #date::before {
      content: "";
      display: block;
      width: 28px; height: 2px;
      margin: 0 auto 16px;
      border-radius: 2px;
      background: var(--accent);
      opacity: .8;
    }
    @keyframes in { from { opacity: 0; transform: translateY(-4vh); } }
    @media (prefers-reduced-motion: reduce) { main { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div id="time"></div>
    <div id="date"></div>
  </main>
  <script>
    const time = document.getElementById('time');
    const date = document.getElementById('date');
    function tick() {
      const d = new Date();
      time.textContent = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      date.textContent = d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
