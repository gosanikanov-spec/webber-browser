name: Release

# Builds the Linux AppImage and publishes it as a GitHub release.
# Runs when a version tag (v0.1.0, v0.2.0, …) is pushed, or by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --linux AppImage --x64 --publish never
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Webber ${TAG#v}" --prerelease \
              --notes-file .github/release-notes.md
          gh release upload "$TAG" dist/*.AppImage scripts/install-linux.sh --clobber
