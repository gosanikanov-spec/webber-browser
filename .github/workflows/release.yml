name: Release

# Builds Webber for Linux (AppImage) and Windows (installer + portable .exe) and
# publishes them as a GitHub release. Runs when a version tag (v0.1.0, …) is pushed,
# or by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release if it doesn't exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Webber ${TAG#v}" --prerelease \
              --notes-file .github/release-notes.md

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage --x64
            files: dist/*.AppImage scripts/install-linux.sh
          - os: windows-latest
            args: --win --x64
            files: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(${{ matrix.files }})
          # electron-builder also writes "__uninstaller" helper exes; only ship the real ones
          keep=()
          for f in "${files[@]}"; do [[ "$f" == *uninstaller* ]] || keep+=("$f"); done
          ls -la "${keep[@]}"
          gh release upload "$TAG" "${keep[@]}" --clobber
